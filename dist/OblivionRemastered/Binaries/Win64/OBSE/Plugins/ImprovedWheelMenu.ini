; ============================================================================
; Improved Wheel Menu for Oblivion Remastered - settings.
;
; The game's own Quick Keys radial is the wheel. This plugin manages what stands
; behind its eight slots: two wheels (Inventory and Magic), several entries a
; slot (LT / RT choose the entry, RB or A use it), and the favourites that fill it - and a
; third, the ammo wheel, which opens with a bow held.
; ============================================================================

[Log]
; 0 trace, 1 debug, 2 info, 3 warn, 4 error. The log is
; Documents\My Games\Oblivion Remastered\OBSE\Logs\ImprovedWheelMenu.log
; 3 = warnings and errors only; set 2 or 1 (also writes ImprovedWheelMenu.selfcheck.txt) to send a log with a bug report.
uLogLevel=3

[Wheel]
; The XInput button that opens the game's quick-key wheel in gameplay: 256 = LB, the game's own default binding of the quick-key wheel
; (IA_Game_QuickKeys_OpenMenu); 2 = D-pad down (the original plugin's assumption). Match it to the button your Controls page uses for that action.
; 1 D-pad up, 2 D-pad down, 4 D-pad left, 8 D-pad right, 16 Start, 32 Select, 64 L3, 128 R3, 256 LB, 512 RB.
uWheelButton=256
; A button that opens the radial straight on one wheel (instead of switching with the D-pad): it makes that wheel the active one and holds the
; wheel button for as long as it is down. XInput masks: 1 D-pad up, 2 D-pad down, 4 D-pad left, 8 D-pad right, 16 Start, 32 Select, 64 L3,
; 128 R3, 256 LB, 512 RB, 4096 A, 8192 B, 16384 X, 32768 Y. 0 = none. The Ammo wheel needs a bow in hand.
uEquipmentWheelButton=0
uMagicWheelButton=0
uAmmoWheelButton=0
; Speed of the radial's pop-up / pop-out animation, in percent (100 = the game's own, 300 = three times as fast; 100 to 1000).
uAnimSpeedPercent=300
; How many entries one slot of a wheel holds. The entry on top is the game's
; quick key for that slot; the others wait behind it.
uEntriesPerSlot=5

; 1 = the radial points only at slots that hold something (empty ones are skipped: the stick's direction goes to the nearest filled slot), as the
; Ammo shortcut already does. 0 (the default) = any slot can be pointed, filled or not.
bPointFilledOnly=0

; 1 = the favourite star (Inventory and Magic menu) sits in the margin before the row's icon. 0 = the old place, a column at the row's right edge (under
; the sort headers).
bFavouriteStarAtLeft=1
; Pixels from the row's left edge to the star's left edge, and how many pixels the row's icon, name and columns move right to make room for it.
iFavouriteStarX=6
iFavouriteStarSpace=44

; 1 = a favourite (an item on the Equipment, Ammo or favourite wheels) cannot be dropped, sold or handed over (the original mod's rule).
; 0 = it can: dropped or sold, it leaves the wheel once none is carried.
bBlockFavouriteDropSell=0

; 1 = choosing an item on the Equipment wheel (A, RB or a click) uses it - puts on or takes off gear, drinks a potion, applies a poison - and leaves the wheel open,
; so several can be used in one opening. Close it with the wheel button or B. 0 = the wheel closes on every choice.
bStayOpenAfterUse=1

; 1 = armour and clothing can be put on the Equipment wheel like weapons and potions (assign them in the Inventory as any item).
; 0 = only shields can, as in the original mod (armour stays a favourite, never on the wheel).
bArmourOnWheel=1

; 1 = the radial opens on the wheel you left it on (Magic, Ammo...). 0 = it always opens on the Equipment wheel and D-pad left / right
; move from there; a wheel's own button (uMagicWheelButton ...) still opens that wheel.
bRememberWheel=1

; 1 = closing the wheel (letting go of the wheel button, or pressing it again) uses the slot the right stick points at, on whichever wheel is up:
; point with the stick and close, no A or RB needed. B still closes without using anything. 0 = a slot is used only with A or RB.
; With bCentreRestSnap=1 the pointed slot is cleared when the stick comes back to rest, so keep the stick pointed while you close.
bChooseOnClose=1
; With the wheel open, the right stick back at rest in the middle for this long
; points at no slot, so letting go of the stick never picks one by mistake.
; 1 on, 0 off.
bCentreRestSnap=1
; Milliseconds at rest before the pointer lets go (30 to 1000).
uRestSnapMs=150

[AmmoWheel]
; A half wheel on the middle of the right-hand edge with the arrows you have
; favourited (Select on arrows in the inventory). It opens with a bow held.
; 1 on, 0 off.
bEnabled=1
; The button that opens it, as an XInput button number: 1 D-pad up, 2 D-pad
; down, 4 D-pad left, 8 D-pad right (the default). With the ammo wheel open:
; the right stick or D-pad up / down points, this button again or A equips the
; pointed arrows, B closes without equipping.
uButton=8
; Where the ammo wheel opens: 0 = a half wheel on the middle of the right-hand edge, 1 = the whole ring in the middle of the screen,
; like the other wheels (the arrows sit on its left half).
uPosition=1
; Size, in percent (50 to 200).
uScalePercent=100

[Keyboard]
; The keyboard as a virtual controller: each key below presses the controller control it is named for, so every controller
; rule (the wheels, the assign panel, favouriting, clearing a slot, the ammo wheel) works from the keyboard. 1 on, 0 off.
; With no controller connected the game is handed a pad while one of these keys is down. NONE (or empty) leaves a control unbound.
; Key names: A-Z, 0-9, F1-F24, NUMPAD0-NUMPAD9, NUMPADADD/SUBTRACT/MULTIPLY/DIVIDE/DECIMAL, INSERT, DELETE, HOME, END,
; PAGEUP, PAGEDOWN, UP/DOWN/LEFT/RIGHT, BACKSPACE, ENTER, SPACE, TAB, ESCAPE, COMMA, PERIOD, MINUS, EQUALS, LBRACKET,
; RBRACKET, SEMICOLON, QUOTE, SLASH, BACKSLASH, GRAVE, LBUTTON/RBUTTON/MBUTTON, or a hex code such as 0x75.
; The game's own keyboard radial (hold R) and its quick keys 1-8 are untouched: use them with these.
bEnabled=1
; Wheel button (LB) - opens the radial, as on the controller.
sLB=END
; Uses the pointed slot (RB) - with the radial open.
sRB=BACKSLASH
; Steps the pointed slot's entry (LT / RT).
sLT=COMMA
sRT=PERIOD
; D-pad: left / right switch the wheels with the radial open (and, with a bow held, right opens the ammo wheel).
sDpadLeft=LBRACKET
sDpadRight=RBRACKET
sDpadUp=NONE
sDpadDown=NONE
; Select favourites the highlighted item / spell in the Inventory / Magic menu; L3 shows the assign panel there; hold X clears the pointed slot.
sSelect=F
sL3=HOME
sX=DELETE
sA=NONE
sB=NONE
sY=NONE
sR3=NONE
sStart=NONE
; The right stick (points at a slot on the radial). Unbound: point with the mouse.
sStickUp=NONE
sStickDown=NONE
sStickLeft=NONE
sStickRight=NONE
; A key per wheel, opening the radial straight on it (hold it, as the wheel button): NONE = unbound.
sEquipmentWheel=NONE
sMagicWheel=NONE
sAmmoWheel=NONE
; Slot keys, 1 to 8 (two lists: the number row and the numpad - the game's own quick keys are taken off them, see below):
;   in gameplay a slot key points at that slot and uses it at once (wheel button, the stick at the slot, then A);
;   in the Inventory / Magic menu it assigns the highlighted item / spell to that slot through the assign panel (the Magic
;   menu fills the Magic wheel, the Inventory the Equipment wheel). Eight names, comma separated.
sSlotKeys=NUMPAD1,NUMPAD2,NUMPAD3,NUMPAD4,NUMPAD5,NUMPAD6,NUMPAD7,NUMPAD8
sSlotKeysAlt=1,2,3,4,5,6,7,8
; 1 = with no controller connected, the game is handed an idle connected pad all the time. The game polls a missing pad only
; now and then, so without this the keys would reach the rules a few times a minute. 0 = no pad is invented.
bVirtualPadWhenNone=1
; 1 = take the game's own keyboard quick keys (IA_Game_QuickKeys_Keyboard_1-8) off their keys, so a digit no longer opens
; the radial by itself or assigns to the game's old key storage; only the plugin's slot keys act. 0 = leave them.
bReplaceQuickKeys=1

[Display]
; Where things sit on the wheel and how big they are, in percent. The defaults suit a 2560 x 1440 screen at the game's own UI
; scale; change a value only if something is off on yours.
; The UI scale mouse clicks are converted with: 0 = ask the game (right in almost every case); otherwise 133 means 1.33.
uUiScalePercent=0
; How far out the eight cells' centres are, as a share of the wheel picture's half-width (counters and clicks use it).
uCellRingPercent=71
; How close to a cell's centre a click counts, the same measure.
uCellHitPercent=24
; The slot counters ("2/5"): text size, and how far below their cell they sit.
uCountTextPercent=60
uCountBelowPercent=11
; The Magic wheel's centre name: text size and how many characters a line holds before it wraps.
uCentreTextPercent=70
uCentreLineChars=26

[Controller]
; The XInput button that favourites the highlighted item or spell in the inventory / magic menu (and takes it off).
;   1 D-pad up, 2 D-pad down, 4 D-pad left, 8 D-pad right, 16 Start, 32 Select/Back, 64 left stick click,
;   128 right stick click, 256 LB, 512 RB, 4096 A, 8192 B, 16384 X, 32768 Y (the original: Y favourites and the
;   game's sorting moves to the left stick click), 0 = no controller button.
; The button is hidden from the game while a menu is open, so choose one the menus do not need.
uFavouriteButton=32
; 1 = in the inventory / magic menu a hold on D-pad down presses the game's own Show Shortcuts (L3) for you, and a tap is replayed
; after the release; 0 = D-pad down stays the game's own and L3 opens the assign panel natively.
bDpadDownPanel=0
